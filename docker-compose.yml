# silo-usenet: direct-stream Easynews into Silo.
#
# Fill in .env (copy from .env.example), then: docker compose up -d
#
# How the mount reaches Silo:
#   this container mounts rclone at /mount (bound to ${MOUNT_HOST_PATH} on the
#   host with rshared propagation). Your Silo container binds the SAME host path
#   with rslave propagation, so the on-demand files appear inside Silo. The
#   provisioner then creates the Silo library pointing at SILO_MEDIA_PATH (the
#   path Silo sees). See README.md.

services:
  silo-usenet:
    image: ghcr.io/neoo-blue/silo-usenet:latest   # published by the CI workflow
    # build: .                                    # uncomment to build locally instead
    container_name: silo-usenet
    restart: unless-stopped
    cap_add:
      - SYS_ADMIN                 # required for FUSE mount
    devices:
      - /dev/fuse
    security_opt:
      - apparmor:unconfined
    environment:
      EASYNEWS_USER: ${EASYNEWS_USER}
      EASYNEWS_PASS: ${EASYNEWS_PASS}
      SILO_URL: ${SILO_URL}
      SILO_API_KEY: ${SILO_API_KEY}
      SILO_MEDIA_PATH: ${SILO_MEDIA_PATH:-/mnt/library/usenet-live}
      LIBRARY_NAME: ${LIBRARY_NAME:-Usenet Live}
      VFS_CACHE_MODE: ${VFS_CACHE_MODE:-off}
      # dynamic catalog: point at Radarr and anything you request (via Seerr) or
      # monitor shows up here, streamable before it even finishes downloading
      RADARR_URL: ${RADARR_URL:-}
      RADARR_API_KEY: ${RADARR_API_KEY:-}
      RADARR_FILTER: ${RADARR_FILTER:-missing}
    volumes:
      - ./config:/config
      - type: bind
        source: ${MOUNT_HOST_PATH:-/mnt/library/usenet-live}
        target: /mount
        bind:
          propagation: rshared

  # Reference only: how your existing Silo service binds the same host path so
  # the mount is visible inside it. Merge these two lines into your real Silo
  # service (do not run a second Silo).
  #
  # silo:
  #   volumes:
  #     - type: bind
  #       source: ${MOUNT_HOST_PATH:-/mnt/library/usenet-live}
  #       target: ${SILO_MEDIA_PATH:-/mnt/library/usenet-live}
  #       bind:
  #         propagation: rslave
