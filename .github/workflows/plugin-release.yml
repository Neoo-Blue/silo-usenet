name: plugin release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Build request-router plugin
        working-directory: plugin
        run: CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.arch }} go build -o silo-usenet-router-linux-${{ matrix.arch }} .
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: plugin/silo-usenet-router-linux-${{ matrix.arch }}
